skill:"AI fundamentals"},context:{term:"Context window",def:"The maximum number of tokens a model can consider at once, including your prompt and its reply.",example:"Anything outside the window simply does not exist for the model.",requires:["token"],skill:"AI fundamentals"},prompt:{term:"Prompt",def:"The instructions and input text you send to a model to steer what it produces.",example:"A good prompt states the task, the input, and the exact output format.",requires:["llm"],skill:"AI fundamentals"},api:{term:"API",def:"A defined interface that lets one piece of software request work or data from another.",example:"Your app sends a request to the model provider\u2019s API and gets text back.",skill:"APIs"},endpoint:{term:"Endpoint",def:"A specific URL on an API that performs one kind of operation.",example:"A \u201Cmessages\u201D endpoint accepts a conversation and returns the model\u2019s reply.",requires:["api"],skill:"APIs"},request:{term:"Request",def:"The message your code sends to an endpoint: method, headers, and a body describing what you want.",example:"The body names the model, the messages, and limits like max tokens.",requires:["endpoint"],skill:"APIs"},response:{term:"Response",def:"What the API sends back: a status code plus a body containing the result or an error.",example:"A 200 status with the model\u2019s text, token usage, and a stop reason.",requires:["request"],skill:"APIs"},sdk:{term:"SDK",def:"A library that wraps an API in functions for your language, handling details like auth and retries.",example:"Instead of building HTTP calls by hand you call client.messages.create().",requires:["api"],skill:"APIs"},apikey:{term:"API key",def:"A secret string that identifies your account to an API and authorises requests.",example:"Keep it in an environment variable, never in your code or repo.",requires:["api"],skill:"APIs"},json:{term:"JSON",def:"A plain-text format for structured data made of objects, arrays, strings, numbers and booleans.",example:'{"title": "Q3 report", "sentiment": "positive"}',skill:"APIs"},structured:{term:"Structured output",def:"Model output constrained to a schema, so your code can parse it reliably instead of scraping prose.",example:"Ask for JSON matching a schema and validate it before using it.",requires:["json","prompt"],skill:"APIs"},errors:{term:"Error handling",def:"Detecting failed requests and responding sensibly: retrying, backing off, or showing a clear message.",example:"Retry a 429 rate-limit error after a short, growing delay.",requires:["response"],skill:"APIs"},ratelimit:{term:"Rate limit",def:"A cap on how many requests or tokens you can send per minute.",example:"Exceeding it returns HTTP 429 until the window resets.",requires:["errors"],skill:"APIs"},chunking:{term:"Chunking",def:"Splitting long text into pieces small enough to fit the context window, ideally on natural boundaries.",example:"Split a 60-page PDF by section, with a little overlap between chunks.",requires:["context"],skill:"RAG"},embedding:{term:"Embedding",def:"A list of numbers that represents the meaning of a piece of text, so similar meanings sit close together.",example:"\u201Crefund policy\u201D and \u201Chow do I get my money back\u201D have nearby embeddings.",requires:["token"],skill:"RAG"},similarity:{term:"Similarity search",def:"Finding the stored embeddings closest to a query\u2019s embedding, usually by cosine similarity.",example:"Return the five chunks most similar to the user\u2019s question.",requires:["embedding"],skill:"RAG"},vectordb:{term:"Vector store",def:"A database built to store embeddings and run fast similarity search over them.",example:"For a prototype, a list in memory is enough. At scale, use a dedicated store.",requires:["similarity"],skill:"RAG"},retrieval:{term:"Retrieval",def:"Fetching the most relevant pieces of your own data for a question before asking the model.",example:"Search your docs first, then pass the top matches into the prompt.",requires:["similarity"],skill:"RAG"},rag:{term:"RAG",def:"Retrieval-augmented generation: retrieve relevant documents, put them in the prompt, and have the model answer from them.",example:"It lets a model answer questions about data it was never trained on.",requires:["retrieval","prompt","chunking"],skill:"RAG"},grounding:{term:"Grounding",def:"Constraining answers to supplied sources and citing them, so the model doesn\u2019t fill gaps with guesses.",example:"\u201CAnswer only from the context below. If it isn\u2019t there, say so.\u201D",requires:["rag"],skill:"RAG"},system:{term:"System prompt",def:"Standing instructions that set the model\u2019s role, rules and tone for the whole conversation.",example:"\u201CYou are a support assistant for Acme. Be concise.\u201D",requires:["prompt"],skill:"AI fundamentals"},history:{term:"Conversation history",def:"The list of previous messages you resend each turn so the model can follow the conversation.",example:"Models are stateless; memory is just the history you include.",requires:["context"],skill:"AI fundamentals"},functioncall:{term:"Function calling",def:"Describing your functions to the model so it can ask your code to run one with specific arguments.",example:'The model replies with get_weather(city="Lisbon") instead of guessing the weather.',requires:["structured"],skill:"Tool use"},tool:{term:"Tool",def:"A function or external API the model is allowed to request, described by a name, purpose and input schema.",example:"search_docs, send_email, create_ticket.",requires:["functioncall"],skill:"Tool use"},toolselect:{term:"Tool selection",def:"How the model decides which tool, if any, fits the request, guided mostly by your tool descriptions.",example:"Two tools with vague, overlapping descriptions cause wrong picks.",requires:["tool"],skill:"Tool use"},agentloop:{term:"Multi-step workflow",def:"A loop where the model calls a tool, reads the result, and decides the next step until the task is done.",example:"Search \u2192 read the top result \u2192 draft a reply \u2192 ask before sending.",requires:["toolselect"],skill:"Tool use"},ui:{term:"Chat UI",def:"The interface people use to talk to your app: input, message list, loading and error states.",example:"Show a typing state while waiting, and keep the input usable after errors.",skill:"Shipping"},state:{term:"Application state",def:"The data your app keeps track of between interactions, like the current conversation and settings.",example:"Store the messages array once and render from it.",requires:["history"],skill:"Shipping"},streaming:{term:"Streaming",def:"Receiving the model\u2019s reply token by token as it\u2019s generated, instead of waiting for the full response.",example:"Makes a 6-second answer feel instant.",requires:["response"],skill:"Shipping"},auth:{term:"Authentication",def:"Verifying who a user is before letting them use your app, so you can protect data and control cost.",example:"Never expose your model API key to the browser; call it from your server.",requires:["apikey"],skill:"Shipping"},envvar:{term:"Environment variable",def:"A value set outside your code, used for secrets and settings that differ between machines.",example:"ANTHROPIC_API_KEY set in your host\u2019s dashboard.",requires:["apikey"],skill:"Shipping"},deploy:{term:"Deployment",def:"Putting your app on a server with a public URL so other people can use it.",example:"Push to a host, set environment variables, and check the logs.",requires:["envvar"],skill:"Shipping"}},quiz:[{id:"q-token",concept:"token",prompt:"Why does a 300-page PDF fail when you paste it into a single request?",options:["The API rejects PDFs","It exceeds the model\u2019s context window in tokens","Models can only read 1,000 words","The text must be JSON"],answer:1,explanation:"Every request is limited by the context window, measured in tokens. Long documents need chunking and retrieval."},{id:"q-api",concept:"api",prompt:"What is the difference between an API and an SDK?",options:["They are the same thing","An SDK is the server; an API is the client","An API is the interface; an SDK is a library that makes using it easier","An SDK is only for mobile apps"],answer:2,explanation:"The API defines how systems communicate. The SDK wraps that API in convenient functions for your language."},{id:"q-apikey",concept:"apikey",prompt:"Where should your model API key live in a deployed web app?",options:["In the frontend JavaScript","In a server-side environment variable","In the README","In the prompt"],answer:1,explanation:"Anything shipped to the browser is public. Keep keys on the server in environment variables."},{id:"q-struct",concept:"structured",prompt:"What makes structured outputs more reliable than asking for \u201Ca list\u201D?",options:["They\u2019re cheaper","They constrain output to a schema your code can validate and parse","They make the model smarter","They skip the context window"],answer:1,explanation:"A schema turns free text into predictable data, and validation catches the rare malformed reply."},{id:"q-errors",concept:"errors",prompt:"Your app gets HTTP 429. What is the right response?",options:["Retry immediately in a tight loop","Give up and crash","Retry after a delay that grows with each attempt","Switch to a smaller prompt"],answer:2,explanation:"429 means rate limited. Exponential backoff gives the window time to reset."},{id:"q-embed",concept:"embedding",prompt:"What does an embedding capture?",options:["The exact spelling of text","The meaning of text as a vector of numbers","A compressed copy of the file","The model\u2019s weights"],answer:1,explanation:"Embeddings place similar meanings close together, which makes semantic search possible."},{id:"q-retrieval",concept:"retrieval",prompt:"In retrieval, what gets compared to find relevant chunks?",options:["File names","The query embedding and the stored chunk embeddings","Word counts","Upload dates"],answer:1,explanation:"You embed the question and find the stored chunks whose embeddings are most similar."},{id:"q-rag",concept:"rag",prompt:"What problem does RAG primarily solve?",options:["Slow responses","Answering from data the model was never trained on","Reducing API cost to zero","Making the model larger"],answer:1,explanation:"RAG retrieves your data at question time and gives it to the model as context."},{id:"q-ground",concept:"grounding",prompt:"A RAG bot answers confidently with facts that aren\u2019t in your docs. What helps most?",options:["A higher temperature","Instructing it to answer only from provided context and cite sources","Removing the system prompt","Longer chunks"],answer:1,explanation:"Grounding instructions plus citations make unsupported answers visible and less likely."},{id:"q-fc",concept:"functioncall",prompt:"With function calling, who actually runs the function?",options:["The model provider","The model itself","Your code, using the arguments the model chose","The user\u2019s browser automatically"],answer:2,explanation:"The model only requests a call. Your code executes it and returns the result."},{id:"q-toolsel",concept:"toolselect",prompt:"The model keeps choosing the wrong tool. What do you fix first?",options:["The tool descriptions","The model version","The font","The rate limit"],answer:0,explanation:"Tool selection is driven by names and descriptions. Make them specific and non-overlapping."},{id:"q-deploy",concept:"deploy",prompt:"Your app works locally but fails after deploying. What do you check first?",options:["The CSS","Environment variables and server logs","The prompt wording","The README"],answer:1,explanation:"Missing secrets are the most common deploy failure, and logs tell you what broke."}],modules:[{title:"Understand How AI Applications Work",description:"The mental model everything else builds on: what a model is, what it can see, and how your code talks to it.",lessons:[{title:"What is an LLM?",video:"How Large Language Models Actually Work (No Math)",by:"pec",min:14.3,views:31e5,objective:"Build an accurate mental model of what a language model does, and what it doesn\u2019t.",outcomes:["Explain next-token prediction in plain language","Say why models sometimes state wrong things confidently"],concepts:["llm","token"],chapters:[["Introduction","Most explanations of AI either drown you in math or hand-wave. We\u2019re going to build an intuition you can actually use when you build something."],["Predicting the next word","A language model is trained to predict the next token given everything before it. Do that billions of times on a huge amount of text and you get something that can write, summarise and answer."],["It isn\u2019t thinking like you","The model isn\u2019t \u201Cthinking\u201D in the human sense. It is learning statistical relationships from data, which is why it can be fluent and wrong at the same time."],["Why this matters for builders","If the model only sees text, then the quality of what you send it, and how you check what comes back, is most of the job."],["Recap","Next-token prediction, learned from data, steered by your input. Keep that model in your head for the rest of the course."]],quotes:["I\u2019ve watched three tutorials and this is the first one where it actually clicked.","The \u201Cfluent and wrong at the same time\u201D line changed how I use these tools.","Sent this to my whole team. Finally an explanation without the hype."],fitNote:"Starts from zero and introduces the exact vocabulary (tokens, context, prompts) that the next three lessons use.",thumb:"What is an LLM?"},{title:"Tokens and context",video:"Tokens & Context Windows, Visually Explained",by:"mira",min:11.8,objective:"Understand the unit models read in, and the hard limit on how much they can see.",outcomes:["Estimate token counts for real text","Explain why long documents need a different approach"],concepts:["token","context"],chapters:[["Introduction","Models don\u2019t read words. They read tokens, and they can only hold so many at once."],["What a token is","A token is roughly three-quarters of a word. Common words are one token, rare words get split up, and code tends to use more tokens than prose."],["The context window","The context window is everything the model can see in one request: your instructions, the input, the conversation so far, and its own reply."],["When you run out","Anything that doesn\u2019t fit is invisible to the model. This is the reason retrieval exists, which you\u2019ll build in Module 4."],["Cost and speed","Providers bill by tokens, and more tokens means slower replies. Sending less, better context is usually the win."]],fitNote:"Bridges \u201Cwhat a model is\u201D into the practical limit that shapes every later design decision, especially chunking and RAG."},{title:"Prompts vs programs",video:"Prompts Are Not Programs (And Why That Matters)",by:"sn",min:13.1,objective:"See where the model ends and your code begins in a real application.",outcomes:["Split a feature into model work and code work","Write a prompt with task, input and output format"],concepts:["prompt","system"],chapters:[["Introduction","A prompt feels like code but it isn\u2019t. It\u2019s a suggestion to a probabilistic system."],["What prompts are good at","Fuzzy language tasks: summarising, classifying, extracting, rewriting. Things that are hard to write rules for."],["What code is good at","Anything that must be exact: arithmetic, validation, permissions, saving data. Don\u2019t ask the model to do what a function can do perfectly."],["Anatomy of a good prompt","State the task, give the input clearly separated, and say exactly what format you want back. Standing rules go in the system prompt."],["Recap","Your application is code that calls a model for the fuzzy parts and checks everything that comes back."]]},{title:"APIs",video:"APIs Explained for Absolute Beginners",by:"bsl",min:18.7,objective:"Make your first API request and understand the response.",outcomes:["Explain what an API and an endpoint are","Read a request and a response and say what each part does","Tell an API from an SDK"],concepts:["api","endpoint","request","response","sdk"],chapters:[["Introduction","Every AI application you\u2019ll build talks to a model through an API. Ten minutes on the basics will save you hours of confusion later."],["What is an API?","An API is a defined interface that lets one program ask another for work or data. You send a request in an agreed shape, and you get a response in an agreed shape."],["Endpoints","An endpoint is a specific URL that does one thing. The model provider exposes an endpoint that takes a list of messages and returns the model\u2019s reply."],["Making a request","A request has a method like POST, headers that carry your API key, and a JSON body: which model, which messages, and limits like max tokens."],["Understanding the response","The response has a status code and a body. A 200 means success; the body holds the model\u2019s text, how many tokens were used, and why it stopped."],["API vs SDK","An SDK is a library that wraps the API in normal functions for your language. Same API underneath, far less boilerplate. We\u2019ll use the Python SDK from here on."]],quotes:["Came here knowing nothing about APIs and made my first request ten minutes later.","The restaurant analogy at 2:14 is the one that finally made it click.","Clear, calm, no filler. Subscribed."],fitNote:"Transitions from prompts (what you send) to the mechanism that carries them, setting up your first real request in the next lesson.",thumb:"APIs, explained",exercise:{kind:"code",language:"python",prompt:"This request is missing two required parts of the body. Add the model name and a max token limit.",starter:`import anthropic

f Any LLM",by:"pec",min:17.6,views:19e5,objective:"Make the model return data your code can trust.",outcomes:["Define a schema for the output you need","Validate and recover from malformed output"],concepts:["json","structured"],chapters:[["Introduction","If your code has to parse prose, it will break. Structured output fixes that."],["Why \u201Creturn a list\u201D fails","Without constraints the model might add a friendly preamble, change keys, or wrap JSON in markdown. Each one breaks your parser."],["Describe the schema","Give the exact shape: keys, types, allowed values. Use the provider\u2019s structured output or tool features where available."],["Validate everything","Parse the JSON, validate against the schema, and if it fails, retry once with the error message included."],["Recap","Schema in, validated data out. This is the foundation for tool calling in Module 6."]],exercise:{kind:"code",language:"python",prompt:'Modify this request so the summary comes back as JSON with a "title" string and a "bullets" list, then parse it.',starter:`prompt = f"Summarise this article:\\n\\n{article}"
